name: notify claude-2

# OWNER SECTION: managed-install automation; public users can skip this file.
# This workflow preserves the owner's existing configuration-repository routing.
# It is not needed to install or run the skill. See README.md's owner section.
# Installed by scripts/rollout_pin_sync_sender.py in the owner's configuration.
# CLAUDE_2_DISPATCH_TOKEN has Contents: write only on the destination below;
# it is distinct from the receiver's PIN_SYNC_TOKEN.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: notify-claude-2
  cancel-in-progress: false

jobs:
  notify:
    name: Dispatch the merged commit
    runs-on: ubuntu-latest
    steps:
      - name: Tell agents-home which commit was merged
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_2_DISPATCH_TOKEN }}
          SKILL_REPOSITORY: ${{ github.repository }}
          MERGED_SHA: ${{ github.sha }}
        run: |
          set -eu
          gh api repos/asabirov/agents-home/dispatches \
            --method POST \
            --field event_type=skill-merged \
            --field "client_payload[repository]=${SKILL_REPOSITORY}" \
            --field "client_payload[sha]=${MERGED_SHA}"
